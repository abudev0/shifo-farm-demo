<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shifo Farm demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + jarayon chizig'i, chapda rol oynasi, o'ngda bot paneli; telefonda bir ustun */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#f5f7fb; --fg:#141b26; --muted:#5b6678; --line:#d8dfe9;
  --accent:#1f5fc4; --accent-strong:#174c9e; --accent-fg:#ffffff; --accent-soft:#e3ecfa;
  --warn:#94570a; --warn-soft:#fbefd9; --info:#0e6f87; --info-soft:#dff1f5;
  --map-bg:#eaedf1; --map-road:#ffffff; --map-edge:#d2d8e0; --map-water:#b6d0ea; --map-park:#d5e6cf;
  --bot-bg:#e6ebf2; --bubble:#ffffff;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121a; --surface:#141b25; --surface-2:#19212d; --fg:#e3e9f2; --muted:#95a1b3; --line:#273144;
  --accent:#6ea6ff; --accent-strong:#94bdff; --accent-fg:#08203f; --accent-soft:#172a47;
  --warn:#f0b357; --warn-soft:#3a2c14; --info:#5fc4dd; --info-soft:#12323b;
  --map-bg:#171d26; --map-road:#2c3646; --map-edge:#222a36; --map-water:#1c3550; --map-park:#1d3125;
  --bot-bg:#0f151e; --bubble:#1b2432; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d121a; --surface:#141b25; --surface-2:#19212d; --fg:#e3e9f2; --muted:#95a1b3; --line:#273144;
  --accent:#6ea6ff; --accent-strong:#94bdff; --accent-fg:#08203f; --accent-soft:#172a47;
  --warn:#f0b357; --warn-soft:#3a2c14; --info:#5fc4dd; --info-soft:#12323b;
  --map-bg:#171d26; --map-road:#2c3646; --map-edge:#222a36; --map-water:#1c3550; --map-park:#1d3125;
  --bot-bg:#0f151e; --bubble:#1b2432; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.app{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:18px}
.brand b{font-size:16px;display:block}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--fg);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;box-shadow:0 0 0 3px var(--warn-soft)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* flow bar */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.flow-steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.fs{flex:1 0 auto;min-width:96px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.fs .bar{height:4px;border-radius:2px;background:var(--line)}
.fs.done{color:var(--fg)} .fs.done .bar{background:var(--accent)}
.fs.cur{color:var(--fg);font-weight:600} .fs.cur .bar{background:var(--warn)}
.flow-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flow-hint span b{font-weight:600}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px -4px 0}
.tabs button{border:0;background:none;font:inherit;font-weight:500;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.count{background:var(--accent);color:var(--accent-fg);font-size:11px;border-radius:9px;padding:0 6px;font-weight:600}

/* catalog */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:20px;cursor:pointer}
.chipbtn.on{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.prod{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.prod-top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.tag{color:var(--muted)}
.rx{color:var(--warn);font-weight:600}
.prod-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;padding-top:6px}
.price{font-family:var(--mono);font-weight:500;font-size:14.5px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);color:var(--fg);width:28px;height:30px;font-size:16px;cursor:pointer}
.qty span{min-width:38px;text-align:center;font-family:var(--mono);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.num,td .num{white-space:nowrap}
.totals{display:flex;flex-direction:column;gap:4px;margin-left:auto;min-width:260px;max-width:100%}
.totals div{display:flex;justify-content:space-between;gap:16px}
.totals .grand{font-weight:700;font-size:16px;padding-top:6px;border-top:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* documents */
.doc{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-size:13px}
.parties .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.didox{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--info);background:var(--info-soft);padding:3px 8px;border-radius:6px}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sign{border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.sign.ok{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.note{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.note.info{background:var(--info-soft)} .note.warn{background:var(--warn-soft)} .note.ok{background:var(--accent-soft)}
.note b{display:block;margin-bottom:2px}
.req{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.req dt{color:var(--muted)} .req dd{margin:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--info);border-top-color:transparent;animation:sp 1s linear infinite;flex:none;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--accent)}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:2px;position:relative;z-index:1}
.tl li.done .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl li.cur .tl-dot{border-color:var(--warn);background:var(--warn-soft)}
.tl li:not(.done):not(.cur) .tl-label{color:var(--muted)}
.tl li.cur .tl-label{font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* map */
.map-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.map{display:block;width:100%;height:auto;background:var(--map-bg)}
.m-bg{fill:var(--map-bg)} .m-park{fill:var(--map-park)}
.m-water{fill:none;stroke:var(--map-water);stroke-width:12;stroke-linecap:round}
.m-edge{stroke:var(--map-edge);fill:none;stroke-linecap:square}
.m-road{stroke:var(--map-road);fill:none;stroke-linecap:square}
.m-route{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:5;stroke-dasharray:2 7;stroke-linecap:round;stroke-linejoin:round}
.m-route-done{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.m-label{fill:var(--muted);font-size:10px;font-family:var(--font)}
.m-place{fill:var(--fg);font-size:11.5px;font-weight:600;font-family:var(--font)}
.m-start{fill:var(--fg)} .m-end{fill:var(--accent)} .m-ring{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.car-halo{fill:var(--accent);fill-opacity:.2}
.car-body{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.car-win{fill:var(--surface)}
.map-info{display:flex;flex-wrap:wrap;gap:8px 20px;padding:10px 14px;font-size:13px;border-top:1px solid var(--line);background:var(--surface)}
.map-info div{display:flex;flex-direction:column}
.prog{height:4px;background:var(--line)} .prog i{display:block;height:100%;background:var(--accent);width:0}

/* bot */
.bot{background:var(--bot-bg);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);height:min(680px,calc(100vh - 40px))}
@media (max-width:920px){.bot{position:static;height:460px}}
.bot-head{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--bubble);border-radius:4px 12px 12px 12px;padding:9px 11px 6px;max-width:92%;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px}
.msg time{font-size:11px;color:var(--muted);align-self:flex-end;font-family:var(--mono)}
.msg .btn{align-self:stretch}
.msg.new{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.msg.new{animation:none}}
.bot-foot{padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.doclink{display:inline-flex;align-items:center;gap:8px}
.docicon{width:18px;height:22px;border-radius:3px;background:var(--accent);color:var(--accent-fg);font-size:9px;font-weight:700;display:grid;place-items:center;flex:none}

/* ---- vizual qatlam ---- */
:root{--brand-1:#1546a3;--brand-2:#2b74e0;--on-brand:#ffffff;--on-brand-dim:rgba(255,255,255,.75);--art-bg:95%;--art-fg:50%;--art-soft:84%;--map-block:#dde3ea;--card-shadow:0 1px 2px rgba(18,38,78,.06),0 8px 24px rgba(18,38,78,.07);--paper:#ffffff;--hero-bg:#e6eefc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand-1:#0f2d63;--brand-2:#1c4fa6;--on-brand:#f3f7ff;--on-brand-dim:rgba(243,247,255,.72);--art-bg:19%;--art-fg:64%;--art-soft:32%;--map-block:#1e2632;--card-shadow:0 1px 2px rgba(0,0,0,.35);--paper:#182130;--hero-bg:#142440}}
:root[data-theme="dark"]{--brand-1:#0f2d63;--brand-2:#1c4fa6;--on-brand:#f3f7ff;--on-brand-dim:rgba(243,247,255,.72);--art-bg:19%;--art-fg:64%;--art-soft:32%;--map-block:#1e2632;--card-shadow:0 1px 2px rgba(0,0,0,.35);--paper:#182130;--hero-bg:#142440}
.top{background:linear-gradient(120deg,var(--brand-1),var(--brand-2));color:var(--on-brand);border-radius:14px;padding:14px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.top>*{position:relative;z-index:1}
.top .muted{color:var(--on-brand-dim)}
.logo{background:var(--on-brand);color:var(--brand-1);border-radius:10px}
.top .seg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.top .seg button{color:var(--on-brand-dim)}
.top .seg button.on{background:var(--on-brand);color:var(--brand-1)}
.top .btn{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.4)}
.top .btn:hover{border-color:var(--on-brand)}
.panel,.flow{box-shadow:var(--card-shadow)}
.btn.primary{box-shadow:0 2px 6px rgba(31,95,196,.25)}
/* flow */
.flow-steps{gap:0;padding-top:2px}
.fs{flex:1 0 96px;align-items:center;text-align:center;position:relative;gap:7px}
.fs .bar{display:none}
.fs::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--line)}
.fs:first-child::before{display:none}
.fs.done::before,.fs.cur::before{background:var(--accent)}
.n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;transition:background .3s,border-color .3s,box-shadow .3s}
.fs.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.fs.cur .n{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 5px var(--accent-soft)}
.fs .l{font-size:11.5px;line-height:1.25;padding-inline:4px}
/* catalog hero */
.hero{background:var(--hero-bg);border-radius:12px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:22px;margin-block:4px 6px}
.hero p{color:var(--muted);max-width:44ch}
.perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.perk{display:flex;gap:9px;align-items:center;background:var(--surface);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:500;min-width:0}
.perk .pi{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
/* product art */
.prod{transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.prod:hover{transform:translateY(-2px);box-shadow:var(--card-shadow)}
.prod.in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (prefers-reduced-motion:reduce){.prod,.prod:hover{transition:none;transform:none}}
.art{display:block;width:100%;height:120px;border-radius:8px;background:hsl(var(--h) 70% var(--art-bg));margin-bottom:4px}
.a1{fill:hsl(var(--h) 62% var(--art-fg))}
.a2{fill:hsl(var(--h) 68% var(--art-soft))}
.a3{fill:var(--surface);stroke:hsl(var(--h) 40% var(--art-fg));stroke-width:1.5}
.a0{fill:hsl(var(--h) 68% var(--art-soft));opacity:.55}
.it{display:flex;gap:10px;align-items:center}
.thumb{width:66px;flex:none}.thumb .art{height:44px;margin:0;border-radius:6px}
.sh{filter:brightness(.82)}
.aw{fill:var(--surface);font:600 8.5px var(--font)}
.at{fill:var(--fg);font:700 11px var(--font)}
.ad{fill:hsl(var(--h) 62% var(--art-fg));font:700 14px var(--mono)}
.am{fill:var(--muted);font:500 9px var(--font)}
.rxc{fill:var(--surface);stroke:#c2364a;stroke-width:1.6}
.rxt{fill:#c2364a;font:700 7.5px var(--font)}
.shadow{fill:hsl(var(--h) 40% var(--art-fg));opacity:.14}
.pill{stroke:hsl(var(--h) 40% var(--art-fg));stroke-width:.8}
.logo-img{width:46px;height:46px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.18);flex:none}
.av-img{width:38px;height:38px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 2px rgba(255,255,255,.35);flex:none}
.doc-brand{display:flex;gap:12px;align-items:center}
.doc-brand img{width:44px;height:44px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 1px var(--line);flex:none}
/* status hero */
.st-card{background:var(--surface-2);border-radius:12px;padding:14px;margin:-2px}
.st-hero{display:flex;gap:14px;align-items:center;min-width:0}
.st-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.st-ic.st-warn{background:var(--warn-soft);color:var(--warn)}
.st-ic.st-info{background:var(--info-soft);color:var(--info)}
/* documents */
.doc{background:var(--paper);box-shadow:var(--card-shadow);border-top:4px solid var(--accent)}
.sign{position:relative;min-height:84px}
.stamp{position:absolute;right:10px;top:10px;width:58px;height:58px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-align:center;line-height:1.15;transform:rotate(-12deg);background:var(--surface)}
.stamp::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed var(--accent)}
/* bot */
.bot-head{background:linear-gradient(120deg,var(--brand-1),var(--brand-2));color:var(--on-brand);border-bottom:0}
.bot-head .muted{color:var(--on-brand-dim)}
.bot-head .av{background:var(--on-brand);color:var(--brand-1)}
.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5ee39a;margin-right:5px;vertical-align:1px}
.msgs{background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px}
/* map */
.m-block{fill:var(--map-block)}
.m-glow{fill:none;stroke:var(--accent);stroke-opacity:.16;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.pulse{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.5}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.25}}
.car-cab{fill:var(--accent-strong);stroke:var(--surface);stroke-width:2}
.map-info b.js-eta{color:var(--accent)}

/* ---- ilova (telefon) ---- */
:root{--frame:#172033;--badge:#e5484d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--frame:#2a3549}}
:root[data-theme="dark"]{--frame:#2a3549}
#stage{display:flex;justify-content:center}
.seller-panel{width:100%;max-width:1100px}
.phone{width:min(410px,100%);height:min(860px,calc(100vh - 120px));min-height:640px;background:var(--bg);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 70px rgba(15,35,80,.22);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:480px){.phone{border-width:0;border-radius:18px;height:calc(100vh - 170px);min-height:560px;box-shadow:var(--card-shadow)}}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:9px 24px 3px;font-size:12px;font-weight:600;background:var(--surface)}
.ph-ind{display:flex;align-items:flex-end;gap:2px}
.ph-ind i{display:block;width:3px;background:var(--fg);border-radius:1px}
.ph-ind i:nth-child(1){height:5px}.ph-ind i:nth-child(2){height:7px}.ph-ind i:nth-child(3){height:9px}
.ph-ind b{font-size:10px;margin:0 4px 0 3px}
.ph-ind em{display:block;width:20px;height:10px;border:1.5px solid var(--fg);border-radius:3px;position:relative}
.ph-ind em::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:65%;background:var(--fg);border-radius:1px}
.ph-head{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px}
.ph-head .hd{flex:1;min-width:0}
.ph-head h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head .sub{font-size:12px;color:var(--muted)}
.ph-head img{width:36px;height:36px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 1px var(--line);flex:none}
.ph-tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:10px}
.iconbtn{border:0;background:var(--surface-2);color:var(--fg);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.ndot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--badge);box-shadow:0 0 0 2px var(--surface-2)}
.ph-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;scrollbar-width:thin}
.ph-body.chatbg{background-color:var(--bot-bg);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px;gap:0}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 2px 12px}
.tabbar button{border:0;background:none;color:var(--muted);font:inherit;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;position:relative;min-width:0}
.tabbar button span:not(.bdg):not(.tdot){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{stroke-width:2.3}
.bdg{position:absolute;top:0;left:calc(50% + 5px);min-width:17px;height:17px;border-radius:9px;background:var(--badge);color:#ffffff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface)}
.tdot{position:absolute;top:2px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.ph-banner{position:absolute;top:46px;left:10px;right:10px;z-index:5;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--surface);color:var(--fg);border-radius:16px;padding:10px 12px;box-shadow:0 12px 32px rgba(10,25,60,.28);font:inherit;font-size:12.5px;cursor:pointer;animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ph-banner{animation:none}}
.ph-banner img{width:32px;height:32px;border-radius:50%;background:#ffffff;flex:none;box-shadow:0 0 0 1px var(--line)}
.ph-banner .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
/* catalog */
.greet{background:linear-gradient(125deg,var(--brand-1),var(--brand-2));color:var(--on-brand);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.greet::after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.greet h2{font-size:18px;margin-top:2px}
.greet .muted{color:var(--on-brand-dim)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px;flex-wrap:nowrap}
.hscroll::-webkit-scrollbar{display:none}
.greet .hscroll{margin-inline:-16px;padding-inline:16px}
.gchip{flex:none;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border-radius:20px;padding:6px 10px;font-size:11.5px;font-weight:500}
.chips.hscroll .chipbtn{flex:none}
.sbox{position:relative;display:flex}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox .search{padding-left:38px;width:100%;flex:1;border-radius:12px;background:var(--surface)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .15s,box-shadow .15s}
.pcard.in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .art{height:96px;margin:0 0 4px;border-radius:11px}
.pc-name{font-weight:600;font-size:13px;line-height:1.25}
.pc-meta{font-size:11.5px;color:var(--muted)}
.pc-rx{font-size:11px;color:var(--warn);font-weight:600}
.pcard .price{font-size:13.5px;margin-top:auto;padding-block:5px 4px}
.btn.block{width:100%}
.btn.lg{padding:13px 16px;font-size:14.5px;border-radius:12px}
.qty.wide{justify-content:space-between;width:100%}
.qty.wide button{width:36px;height:30px}
/* cart */
.cline{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 8px}
.cline .thumb{width:72px}.cline .thumb .art{height:58px}
.cl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cl-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:3px}
.rmbtn{border:0;background:none;color:var(--muted);cursor:pointer;align-self:flex-start;padding:2px;border-radius:6px}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.sum-card .totals,.phone .totals{min-width:0;width:100%}
.sticky-cta{position:sticky;bottom:-14px;margin:auto -14px -14px;padding:14px;background:linear-gradient(to bottom,transparent,var(--bg) 35%);display:flex;flex-direction:column;gap:8px;z-index:2}
.empty.grow{flex:1;justify-content:center}
.emp-ic{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
/* orders */
.sec{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.ocard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;font:inherit;color:inherit;width:100%}
button.ocard{cursor:pointer}
button.ocard:hover{border-color:var(--accent)}
.ocard>svg{color:var(--muted);flex:none}
.ocard .st-ic{width:44px;height:44px;border-radius:13px}
.ocard.past .st-ic{background:var(--surface-2);color:var(--muted)}
.oc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ocard .btn{flex:none}
.ilist{display:flex;flex-direction:column;gap:8px}
.iline{display:flex;gap:10px;align-items:center}
.il-main{flex:1;min-width:0}
.phone .doc{padding:14px;gap:12px}
.phone .doc h2{font-size:17px}
.phone .st-card{margin:0;background:var(--surface);border:1px solid var(--line)}
.phone .st-hero h2{font-size:20px}
.phone .actions .btn{flex:1 1 auto}
.phone .box{background:var(--surface)}
.phone .note{border-radius:14px}
.phone .map-card{background:var(--surface)}
.phone .map-info{gap:6px 16px;padding:10px 12px}
.phone .req{grid-template-columns:minmax(0,auto) minmax(0,1fr)}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;flex:1;padding-bottom:12px}
.day{align-self:center;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);padding:3px 10px;border-radius:10px;margin-bottom:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-radius:12px 4px 12px 12px}
.msg.me time{color:inherit;opacity:.75}
.compose{position:sticky;bottom:-14px;margin:0 -14px -14px;padding:10px 14px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qr{flex:none;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:16px;padding:6px 11px;font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.crow{display:flex;gap:8px;margin:0}
.crow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:20px;padding:9px 14px;font:inherit}
.sendbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;flex:none}
/* profile */
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-block:6px}
.avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:var(--on-brand);display:grid;place-items:center;font-size:26px;font-weight:700;box-shadow:0 8px 20px rgba(31,95,196,.3)}
.prof h2{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:18px;font-family:var(--mono);font-weight:500}
.stat span{font-size:11px;color:var(--muted)}
.lgroup{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .k{color:var(--muted);flex:none}
.lrow .v{text-align:right;min-width:0}
.tgl{position:relative;width:42px;height:25px;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tgl span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .2s}
.tgl span::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl input:checked+span{background:var(--accent)}
.tgl input:checked+span::after{transform:translateX(17px)}
.tgl input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}

.phone>:not(.ph-body){flex-shrink:0}
.ph-body{min-height:0}
.ph-body>*{flex-shrink:0}
.ph-head{position:relative;z-index:3}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
function buildContractDocx(JSZipLib, d){
  // d: {no, date, items:[{name,form,qty,price}], client:{...}, seller:{...}, vat}
  const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const N=n=>Math.round(n).toLocaleString('ru-RU').replace(/\s/g,' ');
  const run=(t,o={})=>`<w:r><w:rPr>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||22}"/><w:szCs w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  const P=(c,o={})=>`<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}<w:spacing w:before="${o.before||0}" w:after="${o.after??80}" w:line="264" w:lineRule="auto"/>${o.ind?`<w:ind w:firstLine="${o.ind}"/>`:''}${o.jc?`<w:jc w:val="${o.jc}"/>`:''}</w:pPr>${Array.isArray(c)?c.join(''):run(c,o)}</w:p>`;
  const H=t=>P(t,{b:true,before:200,after:80,keep:true});
  const T=t=>P(t,{jc:'both',ind:0});
  const borders=on=>{const v=on?'w:val="single" w:sz="4" w:space="0" w:color="8A94A6"':'w:val="nil"';return `<w:tblBorders><w:top ${v}/><w:left ${v}/><w:bottom ${v}/><w:right ${v}/><w:insideH ${v}/><w:insideV ${v}/></w:tblBorders>`;};
  const table=(rows,widths,o={})=>`<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${borders(o.borders!==false)}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows.map((r,ri)=>`<w:tr>${r.map((c,ci)=>{const cell=typeof c==='object'?c:{t:c};const head=o.head&&ri===0;const lines=String(cell.t).split('\n');return `<w:tc><w:tcPr><w:tcW w:w="${widths[ci]}" w:type="dxa"/>${cell.span?`<w:gridSpan w:val="${cell.span}"/>`:''}${head?'<w:shd w:val="clear" w:color="auto" w:fill="E3ECFA"/>':''}<w:vAlign w:val="center"/></w:tcPr>${lines.map(l=>P(l,{b:head||cell.b,sz:o.sz||20,after:20,jc:cell.r?'right':(head?'center':undefined)})).join('')}</w:tc>`;}).join('')}</w:tr>`).join('')}</w:tbl>`;

  const sub=d.items.reduce((a,i)=>a+i.price*i.qty,0), vat=sub*d.vat, total=sub+vat;
  const C=d.client, S=d.seller, no=`SH-${d.no}/2026`;
  const body=[
    P('Taxminiy namuna · demo uchun tayyorlangan',{i:true,sz:18,color:'8A94A6',jc:'right',after:120}),
    P(`YETKAZIB BERISH SHARTNOMASI № ${no}`,{b:true,sz:28,jc:'center',after:60}),
    P('(dori vositalari va tibbiy buyumlar)',{jc:'center',sz:20,after:200}),
    table([[ 'Toshkent shahri', {t:d.date,r:true} ]],[4819,4819],{borders:false,sz:22}),
    P('',{after:120}),
    T(`"${S.short}" MChJ (keyingi o'rinlarda "Sotuvchi"), Ustav asosida ish yurituvchi direktor ${S.director} nomidan, bir tomondan, va "${C.short}" MChJ (keyingi o'rinlarda "Xaridor"), Ustav asosida ish yurituvchi direktor ${C.director} nomidan, ikkinchi tomondan, birgalikda "Tomonlar" deb ataluvchilar, quyidagilar haqida ushbu shartnomani tuzdilar:`),
    H('1. Shartnoma predmeti'),
    T(`1.1. Sotuvchi KP-${d.no} tijorat taklifi asosida dori vositalari va tibbiy buyumlarni (keyingi o'rinlarda "Tovar") Xaridorga yetkazib berish, Xaridor esa Tovarni qabul qilib olish va uning haqini to'lash majburiyatini oladi.`),
    T(`1.2. Tovarning nomi, shakli, miqdori va narxi ushbu shartnomaning ajralmas qismi bo'lgan 1-ilovada (Spetsifikatsiya) ko'rsatilgan.`),
    H('2. Shartnoma summasi va to\'lov tartibi'),
    T(`2.1. Shartnomaning umumiy summasi ${N(total)} (QQS bilan) so'mni tashkil etadi, shu jumladan QQS 12% — ${N(vat)} so'm.`),
    T(`2.2. Xaridor shartnoma summasini 100% oldindan, shartnoma imzolangan kundan boshlab 3 (uch) bank kuni ichida Sotuvchining hisob raqamiga o'tkazadi.`),
    T(`2.3. To'lov amalga oshirilgan kun deb mablag' Sotuvchining hisob raqamiga kelib tushgan kun hisoblanadi. To'lov topshiriqnomasida "${no} shartnoma bo'yicha oldindan to'lov" deb ko'rsatiladi.`),
    H('3. Yetkazib berish shartlari'),
    T(`3.1. Sotuvchi Tovarni to'lov kelib tushgandan so'ng 24 soat ichida o'z transportida quyidagi manzilga yetkazib beradi: ${C.addr}.`),
    T(`3.2. Tovar hisob-faktura (Didox) va Xaridor vakilining ishonchnomasi asosida topshiriladi.`),
    T(`3.3. Topshirilayotgan Tovarning qolgan yaroqlilik muddati kamida 12 (o'n ikki) oy bo'lishi, har bir seriyaga sifat sertifikati va O'zbekiston Respublikasida davlat ro'yxatidan o'tganligi to'g'risidagi hujjat ilova qilinishi kerak.`),
    T(`3.4. Dori vositalari ishlab chiqaruvchi belgilagan saqlash harorati rejimiga rioya qilingan holda tashiladi.`),
    H('4. Tomonlarning javobgarligi'),
    T(`4.1. Tovar yetkazib berish muddati buzilganda Sotuvchi Xaridorga kechiktirilgan har bir kun uchun yetkazilmagan Tovar qiymatining 0,5% miqdorida, biroq uning 50% idan ortiq bo'lmagan miqdorda penya to'laydi.`),
    T(`4.2. Sifatsiz yoki yaroqlilik muddati talabga javob bermaydigan Tovar Sotuvchi hisobidan 5 (besh) ish kuni ichida almashtiriladi.`),
    H('5. Fors-major'),
    T(`5.1. Tomonlar yengib bo'lmaydigan kuch (fors-major) holatlari tufayli majburiyatlarni bajarmaganlik uchun javobgar bo'lmaydilar.`),
    H('6. Nizolarni hal etish'),
    T(`6.1. Nizolar muzokaralar yo'li bilan hal etiladi, kelishuvga erishilmaganda — Toshkent shahar iqtisodiy sudida ko'rib chiqiladi.`),

/* ---------- map animation ---------- */
function updateMaps(){
  const o=S.order; if(!o) return;
  document.querySelectorAll('.map-card').forEach(c=>{
    const r=c.querySelector('.m-route-done'),car=c.querySelector('.car'),L=r.getTotalLength(),p=o.trip;
    r.style.strokeDasharray=L; r.style.strokeDashoffset=L*(1-p);
    const pt=r.getPointAtLength(L*p), a=r.getPointAtLength(Math.max(0,Math.min(L,L*p)-1)), b=r.getPointAtLength(Math.min(L,Math.max(1,L*p)+1));
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; car.setAttribute('transform',`translate(${pt.x} ${pt.y}) rotate(${ang})`);
    c.querySelector('.js-prog').style.width=(p*100)+'%';
    c.querySelector('.js-eta').textContent=p>=1?'Yetib keldi':`~${Math.max(1,Math.ceil((1-p)*TRIP_MIN))} daqiqa`;
  });
}
function startTrip(){
  const t0=performance.now();
  const step=now=>{S.order.trip=Math.min(1,(now-t0)/TRIP_MS);updateMaps();
    if(S.order.trip<1) raf=requestAnimationFrame(step);
    else {setStatus('delivered');addBot(`<b>Buyurtma № ${NO} yetkazib berildi</b> (${hhmm()}). Qabul qildi: ${CLIENT.person}. Hisob-faktura Didox kabinetingizda. Xaridingiz uchun rahmat!`);}};
  raf=requestAnimationFrame(step);
}

let busyDl=false;
async function downloadContract(){
  const o=S.order; if(!o||busyDl) return;
  if(typeof JSZip==='undefined'){toast("Word faylni yaratib bo'lmadi: sahifani qayta yuklang.");return;}
  busyDl=true; toast("Shartnoma tayyorlanmoqda…");
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){toast("Bu oynada fayl yuklab bo'lmaydi. Sahifani claude.ai orqali oching.");return;}
    const zip=buildContractDocx(JSZip,{no:NO,date:o.date,items:o.items,client:CLIENT,seller:SELLER,vat:VAT});
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    await dl.save({filename:`Shartnoma SH-${NO}-2026.docx`,data:blob});
    toast("Shartnoma yuklab olindi.");
  }catch(e){ if(e&&e.code==='declined'){document.getElementById('toast').hidden=true;} else if(e&&e.code==='rate_limited'){toast("Oldingi oyna hali ochiq. Uni yoping va qayta bosing.");} else toast("Faylni saqlab bo'lmadi. Qayta urinib ko'ring."); }

}

    case 'rm': delete S.cart[id]; render(); break;

    case 'approvekp': setStatus('new'); addBot(`KP-${NO} tasdiqlandi. Buyurtma <b>№ ${NO}</b> sotuvchiga yuborildi. Menejer ${SELLER.manager} tez orada siz bilan bog'lanadi.`,"Buyurtmani ochish"); break;
    case 'contacted': setStatus('contacted'); addBot(`Menejer ${SELLER.manager} siz bilan bog'landi va buyurtma tafsilotlari kelishildi. Shartnoma tayyorlanmoqda.`); break;
    case 'contract': setStatus('contract'); addBot(`Didox kabinetingizga <b>SH-${NO}/2026</b> shartnomasi yuborildi. ERI bilan imzolang va to'lovni amalga oshiring.`,{label:"Shartnomani ochish",act:'docx'}); break;
    case 'sign': o.signed=true; o.times.signed=hhmm(); render(); addBot(`Shartnoma SH-${NO}/2026 ikki tomonlama imzolandi. To'lov rekvizitlari buyurtma sahifasida.`,"To'lovga o'tish"); break;
    case 'pay': setStatus('paying'); later(3000,onPaid); break;
    case 'neworder': S.past.unshift({no:NO,date:o.date,items:o.items}); NO++; S.order=null; S.tab='catalog'; S.detail=false; render(); break;
    case 'qr': userSays(b.textContent,b.dataset.v); break;
    case 'docx': if(S.role!=='client'||S.tab!=='orders'||!S.detail){S.role='client';S.tab='orders';S.detail=true;render();} downloadContract(); break;
    case 'reset': init(); break;
  }
});
document.addEventListener('submit',e=>{ if(e.target.id!=='chatform') return; e.preventDefault();
  const v=document.getElementById('chatin').value.trim(); if(v) userSays(v.replace(/</g,'&lt;'),'free'); });
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderGrid();}});
init();

</script>
